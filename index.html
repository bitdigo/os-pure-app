<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BitDigo POS - A sleek, client-side, multi-payment Point of Sale system supporting Bitcoin Lightning.">
  <title>BitDigo POS - Point of Sale</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;950&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/styles.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            orange: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
              950: '#431407',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-neutral-950 font-sans text-gray-900 dark:text-neutral-100 antialiased overflow-hidden h-screen transition-colors duration-200">

  <div class="h-screen flex">

    <aside id="sidebar" class="hidden lg:flex flex-col w-[72px] lg:w-[72px] bg-white dark:bg-neutral-900 border-r border-gray-200 dark:border-neutral-800 flex-shrink-0 transition-all duration-200 z-50">
    </aside>

    <div id="sidebar-overlay" class="lg:hidden fixed inset-0 bg-black/50 z-40 hidden backdrop-blur-sm"></div>

    <div class="flex-1 flex flex-col overflow-hidden">

      <header id="navbar" class="h-14 flex-shrink-0 border-b border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 transition-colors duration-200 z-10">
      </header>

      <main class="flex-1 flex overflow-hidden relative bg-gray-50 dark:bg-neutral-950">

        <section id="page-content" class="flex-1 overflow-y-auto relative">
          <div id="page-container" class="min-h-full"></div>
        </section>

        <section class="flex-1 overflow-y-auto hidden" id="product-grid"></section>

        <section 
          id="cart-panel" 
          class="hidden fixed inset-y-0 right-0 z-30 w-full sm:w-96 lg:w-96 transform translate-x-full transition-transform duration-300 ease-in-out"
        ></section>

      </main>

    </div>

  </div>

  <button 
    id="mobile-cart-toggle" 
    class="hidden lg:hidden fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-orange-500 text-white shadow-xl shadow-orange-500/30 flex items-center justify-center text-xl transition-transform active:scale-95"
  >
    <i class="fa-solid fa-basket-shopping"></i>
    <span id="mobile-cart-badge" class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-red-500 text-white text-[11px] font-black flex items-center justify-center hidden">0</span>
  </button>

  <div 
    id="mobile-cart-overlay" 
    class="lg:hidden fixed inset-0 bg-black/50 z-20 hidden backdrop-blur-xs transition-opacity"
  ></div>

  <div id="checkout-modal-container"></div>
  <div id="history-modal-container"></div>
  <div id="catalog-modal-container"></div>
  <div id="pending-orders-modal-container"></div>
  <div id="table-modal-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
      let sidebarOpen = false;

      function toggleSidebar() {
        sidebarOpen = !sidebarOpen;
        if (sidebarOpen) {
          sidebar.classList.remove('hidden');
          sidebar.classList.add('fixed', 'inset-y-0', 'left-0', 'w-64', 'lg:w-64');
          sidebarOverlay.classList.remove('hidden');
        } else {
          sidebar.classList.add('hidden');
          sidebar.classList.remove('fixed', 'inset-y-0', 'left-0', 'w-64', 'lg:w-64');
          sidebarOverlay.classList.add('hidden');
        }
      }

      if (sidebarToggleBtn) sidebarToggleBtn.addEventListener('click', toggleSidebar);
      sidebarOverlay.addEventListener('click', toggleSidebar);

      const toggleBtn = document.getElementById('mobile-cart-toggle');
      const cartPanel = document.getElementById('cart-panel');
      const overlay = document.getElementById('mobile-cart-overlay');
      let cartOpen = false;

      function toggleCart() {
        cartOpen = !cartOpen;
        if (cartOpen) {
          cartPanel.classList.remove('translate-x-full');
          overlay.classList.remove('hidden');
          toggleBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        } else {
          cartPanel.classList.add('translate-x-full');
          overlay.classList.add('hidden');
          toggleBtn.innerHTML = '<i class="fa-solid fa-basket-shopping"></i>';
        }
      }

      toggleBtn.addEventListener('click', toggleCart);
      overlay.addEventListener('click', toggleCart);

      document.addEventListener('click', (e) => {
        if (e.target.closest('#checkout-btn') && cartOpen) {
          toggleCart();
        }
      });
    });
  </script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
